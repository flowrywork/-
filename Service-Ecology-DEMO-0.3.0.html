<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d6b4d">
  <title>Сервис Экология</title>
  
  <style>:root {
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #182c26;
  background: #edf2f0;
  line-height: 1.4;
  --green-950: #0b3b2e;
  --green-900: #104936;
  --green-700: #1d6b53;
  --green-500: #79d644;
  --line: #d9e3df;
  --muted: #6f807a;
}
* { box-sizing: border-box; }
html, body { max-width: 100%; overflow-x: hidden; }
main, section, form, fieldset, .grid, .field, .card, .workspace { min-width: 0; }
body { margin: 0; min-height: 100vh; background: #edf2f0; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }

.login { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: linear-gradient(160deg,#0c3e30,#071c17); }
.login form { display: grid; gap: 14px; width: min(100%,360px); padding: 28px; background: #fff; border-radius: 8px; box-shadow: 0 24px 60px #00120d55; }
.login input, .field input, .field select, .field textarea, .filters input, .filters select {
  width: 100%; border: 1px solid #cbd8d3; border-radius: 6px; padding: 11px 12px; background: #fff; color: #18352c; outline: none;
}
.login input:focus, .field input:focus, .field textarea:focus, .filters input:focus, .filters select:focus { border-color: #2d7a61; box-shadow: 0 0 0 3px #2d7a6118; }
.primary { border: 0; border-radius: 6px; padding: 12px 18px; background: var(--green-700); color: #fff; font-weight: 700; }
.primary:hover { background: #155b45; }
.secondary { border: 1px solid #cfdad6; border-radius: 6px; padding: 8px 12px; background: #fff; color: #24483d; font-weight: 650; }

.shell { width: min(100%, 1180px); min-height: 100vh; margin: auto; background: #edf2f0; box-shadow: 0 0 0 1px #dfe7e3; }
.topbar { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 16px; background: var(--green-950); color: #fff; padding: 14px 20px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand > span:last-child { display: grid; gap: 1px; }
.brand strong { font-size: 16px; letter-spacing: -.01em; }
.brand small { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; opacity: .78; }
.brand-mark { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; background: #a8eb5b; color: #144b34; font-size: 28px; font-weight: 800; line-height: 1; }
.topbar > button { border: 1px solid #ffffff30; border-radius: 6px; padding: 7px 10px; background: #ffffff10; color: #fff; }
.tabs { display: flex; overflow-x: auto; background: var(--green-950); border-top: 1px solid #ffffff12; scrollbar-width: none; }
.tabs button { flex: 1 0 auto; min-width: 130px; border: 0; border-bottom: 3px solid transparent; padding: 12px 15px 10px; background: transparent; color: #c8dad3; font-size: 12px; }
.tabs button.active { color: #fff; background: #ffffff09; border-bottom-color: #8ddb59; }
.nav-icon, .nav-short { display: none; }
.statusbar { display: flex; justify-content: space-between; align-items: center; padding: 9px 20px; background: #fff; border-bottom: 1px solid var(--line); color: #50635c; font-size: 11px; }
.online { color: #446259; }
.online i { display: inline-block; width: 7px; height: 7px; margin-right: 4px; border-radius: 50%; background: #36b56e; box-shadow: 0 0 0 3px #36b56e20; }

.workspace { padding: 20px; }
.page-heading { margin-bottom: 16px; }
.page-heading.split { display: flex; justify-content: space-between; align-items: start; gap: 18px; }
.eyebrow { display: block; margin-bottom: 5px; color: #27755c; font-size: 10px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
.page-heading h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: -.03em; color: #172b25; }
.page-heading p { margin: 7px 0 0; color: var(--muted); font-size: 12px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; margin: 0 0 14px; }
.stat { min-width: 0; padding: 12px 14px; background: #fff; border: 1px solid #e0e8e4; border-radius: 7px; }
.stat small { display: block; overflow: hidden; margin-bottom: 4px; color: #7c8c86; font-size: 9px; white-space: nowrap; text-overflow: ellipsis; }
.stat strong { font-size: 17px; color: #1a3029; }
.card { background: #fff; border: 1px solid #dfe7e3; border-radius: 7px; margin-bottom: 14px; box-shadow: 0 1px 3px #193c3008; }
.card.padded { padding: 16px; }
.form-card { padding: 0 16px 16px; }
.card h2, .card h3 { margin-top: 0; }
fieldset { margin: 0; padding: 16px 0 18px; border: 0; border-bottom: 1px solid #e3eae7; }
fieldset:last-of-type { border-bottom: 0; }
legend { width: 100%; padding: 0 0 13px; color: #253c34; font-size: 12px; font-weight: 800; }
legend span { display: inline-grid; place-items: center; width: 19px; height: 19px; margin-right: 6px; border: 1px solid #b9c9c3; border-radius: 50%; color: #557067; font-size: 10px; }
legend em { margin-left: 5px; color: #73857e; font-size: 10px; font-style: normal; font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 11px; }
.field { display: grid; gap: 5px; }
.field label { color: #374c45; font-size: 10px; font-weight: 750; }
.field input, .field textarea { padding: 10px; font-size: 12px; }
.full { grid-column: 1/-1; }
.photo-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 8px; }
.reception-photos { grid-template-columns: repeat(5,minmax(0,1fr)); }
.photo { min-height: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 10px 5px; border: 1px solid #cfdad6; border-radius: 7px; background: #f7faf8; text-align: center; transition: .15s; }
.photo:hover, .photo.selected { border-color: #d2a92b; background: #fffdf5; }
.photo input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.photo b { color: #1d5b47; font-size: 21px; line-height: 1; }
.photo strong { font-size: 9px; color: #29433a; }
.photo small { color: #87968f; font-size: 8px; }
.form-note { margin: 12px 0; color: #71827b; font-size: 10px; }
.submit-wide { width: 100%; }
.actions { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 13px; }
.filters { display: grid; grid-template-columns: 1fr 1fr 1.5fr; gap: 8px; margin-bottom: 12px; }
.filters input, .filters select { padding: 9px; font-size: 11px; }
.journal-layout { display: grid; grid-template-columns: minmax(0,1fr) 220px; gap: 14px; align-items: start; margin-bottom: 14px; }
.calendar-card { padding: 14px; background: #fff; border: 1px solid #dfe7e3; border-radius: 7px; }
.calendar-card > header { display: grid; grid-template-columns: 36px 1fr 36px; align-items: center; margin-bottom: 14px; text-align: center; }
.calendar-card > header button { width: 32px; height: 32px; border: 1px solid #d8e2de; border-radius: 6px; background: #fff; color: #385248; }
.calendar-card > header strong { font-size: 15px; text-transform: lowercase; }
.weekdays, .calendar-grid { display: grid; grid-template-columns: repeat(7,minmax(0,1fr)); gap: 5px; }
.weekdays { margin-bottom: 5px; }
.weekdays span { padding: 5px; color: #788982; font-size: 9px; text-align: center; }
.calendar-day { min-width: 0; min-height: 65px; display: flex; flex-direction: column; align-items: flex-start; gap: 7px; padding: 7px; border: 1px solid #e0e7e4; border-radius: 6px; background: #fafcfb; color: #344b43; text-align: left; }
.calendar-day span { font-size: 10px; font-weight: 700; }
.calendar-day small { display: flex; gap: 3px; font-size: 8px; color: #4b6b60; }
.calendar-day small b, .calendar-day small em { font: inherit; }
.calendar-day.has-entry { border-color: #a8dfc9; background: #eaf9f2; }
.calendar-day.selected { border-color: #1e795a; box-shadow: inset 0 0 0 1px #1e795a; }
.calendar-day.blank { border-color: transparent; background: transparent; }
.calendar-filters { display: grid; gap: 12px; padding: 15px; background: #fff; border: 1px solid #dfe7e3; border-radius: 7px; }
.calendar-filters h2 { margin: 0 0 2px; font-size: 14px; }
.calendar-filters label { display: grid; gap: 5px; color: #40574f; font-size: 10px; font-weight: 700; }
.calendar-filters input, .calendar-filters select { width: 100%; min-width: 0; padding: 9px; border: 1px solid #cbd8d3; border-radius: 6px; background: #fff; color: #18352c; font-size: 10px; }
.clear-date[hidden] { display: none; }
.list { display: grid; gap: 8px; padding: 12px; }
.item { border: 1px solid #dce5e1; border-radius: 6px; padding: 12px; font-size: 11px; }
.item-head { display: flex; justify-content: space-between; align-items: start; gap: 8px; margin-bottom: 6px; }
.badge { display: inline-block; border-radius: 999px; padding: 3px 8px; background: #eef3f1; color: #667a72; font-size: 9px; }
.badge.ok { background: #dcf4e5; color: #176536; }
.empty { min-height: 150px; display: grid; place-content: center; gap: 5px; color: #364b44; text-align: center; }
.empty small { color: #8a9993; font-size: 10px; }
.error { margin-top: 9px; color: #a22828; white-space: pre-line; font-size: 11px; }
.preview { margin-top: 10px; padding: 14px; border-radius: 6px; background: #f3f7f5; white-space: pre-wrap; font-size: 11px; }
.toast { position: fixed; left: 50%; bottom: 24px; z-index: 20; transform: translate(-50%,20px); opacity: 0; padding: 10px 16px; border-radius: 999px; background: #163b2d; color: #fff; font-size: 12px; transition: .2s; pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%,0); }

@media (max-width: 680px) {
  body { background: #edf2f0; }
  .shell { width: 100%; padding-bottom: calc(70px + env(safe-area-inset-bottom)); box-shadow: none; }
  .topbar { position: sticky; top: 0; z-index: 40; min-height: 62px; padding: 9px 14px; box-shadow: 0 2px 10px #082d2218; }
  .topbar > button { min-width: 60px; min-height: 40px; }
  .brand-mark { width: 34px; height: 34px; font-size: 25px; }
  .brand strong { font-size: 13px; }
  .tabs { position: fixed; z-index: 60; left: 0; right: 0; bottom: 0; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; width: 100%; padding: 5px 5px calc(5px + env(safe-area-inset-bottom)); border-top: 1px solid #d5e1dc; background: #fff; box-shadow: 0 -5px 18px #12382b18; }
  .tabs button { min-width: 0; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 5px 2px; border: 0; border-radius: 8px; color: #71827b; font-size: 10px; line-height: 1; }
  .tabs button.active { color: #176048; border: 0; background: #e8f5ef; }
  .nav-icon { display: block; height: 20px; font-size: 20px; font-style: normal; line-height: 20px; }
  .nav-short { display: block; font-weight: 750; }
  .nav-full { display: none; }
  .statusbar { padding: 8px 14px; }
  .workspace { width: 100%; padding: 15px 12px 20px; }
  .page-heading h1 { font-size: 22px; }
  .page-heading.split { align-items: center; }
  .page-heading.split .secondary { flex: 0 0 auto; min-height: 40px; }
  .grid { grid-template-columns: 1fr; }
  .full { grid-column: auto; }
  .stats { width: 100%; grid-template-columns: repeat(3, minmax(0,1fr)); overflow: hidden; }
  .stat { min-height: 72px; padding: 9px; }
  .stat small { min-height: 24px; overflow: visible; white-space: normal; font-size: 8px; line-height: 1.25; }
  .stat strong { font-size: 14px; white-space: nowrap; }
  .card, .calendar-card, .calendar-filters { width: 100%; max-width: 100%; }
  .form-card { padding-inline: 14px; }
  fieldset { width: 100%; overflow: hidden; }
  .field input, .field textarea, .filters input, .filters select, .calendar-filters input, .calendar-filters select { min-width: 0; font-size: 16px; }
  .photo-grid, .reception-photos { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .photo { min-width: 0; min-height: 104px; padding: 9px 5px; }
  .actions { display: grid; grid-template-columns: 1fr; }
  .actions button, .submit-wide { min-height: 48px; }
  .filters { grid-template-columns: 1fr; }
  .journal-layout { grid-template-columns: 1fr; }
  .calendar-filters { grid-template-columns: 1fr; }
  .calendar-filters h2, .clear-date { grid-column: auto; }
  .calendar-card { padding: 10px; overflow: hidden; }
  .calendar-card > header { margin-bottom: 9px; }
  .weekdays, .calendar-grid { gap: 3px; }
  .calendar-day { aspect-ratio: 1; min-height: 0; overflow: hidden; padding: 5px; }
  .calendar-day small { width: 18px; height: 18px; display: grid; place-items: center; border-radius: 50%; background: #ccecdf; font-size: 8px; }
  .calendar-day small em { display: none; }
  .calendar-day small b { font-weight: 800; }
  .list { padding: 10px; }
  .item { overflow-wrap: anywhere; }
}

@media (max-width: 390px) {
  .stats { gap: 7px; }
  .stat { padding: 10px; }
  .photo-grid { gap: 5px; }
  .reception-photos { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .photo { padding: 7px 3px; }
  .calendar-day { padding: 4px; }
}
</style>

  <script>(function (root) {
  "use strict";
  const PHOTO_FIELDS = Object.freeze([
    ["scaleLoaded", "Весы с грузом"], ["scaleEmpty", "Весы без груза"],
    ["vehicleLoaded", "ТС с грузом"], ["vehicleEmpty", "ТС без груза"],
    ["ttn", "ТТН"], ["vehicleFront", "ТС спереди"]
  ]);
  const MASS_FIELDS = Object.freeze([
    "upnsh08Night", "upnsh08Day", "upnsh11Night", "upnsh11Day", "upnsh13Night", "upnsh13Day",
    "customerWaste", "ownCollection", "contractorWaste", "accumulatedWaste", "nzgImport", "btmImport",
    "nveRocking", "pressed", "stored", "dieselReceived", "dieselBalance"
  ]);
  function number(value) {
    const parsed = Number(String(value == null ? "" : value).replace(",", "."));
    return Number.isFinite(parsed) ? parsed : 0;
  }
  function validate(report) {
    const errors = [];
    if (!report.date) errors.push("Укажите дату");
    if (!String(report.landfill || "").trim()) errors.push("Укажите полигон");
    MASS_FIELDS.forEach((field) => { if (number(report[field]) < 0) errors.push("Масса не может быть отрицательной"); });
    if (number(report.ownCollection) > number(report.customerWaste)) errors.push("Наш сбор не может превышать массу от заказчика");
    const photos = report.photos || {};
    PHOTO_FIELDS.forEach(([key, label]) => { if (!photos[key]) errors.push("Добавьте фото: " + label); });
    if (Object.keys(photos).filter((key) => photos[key]).length !== PHOTO_FIELDS.length) errors.push("Нужно ровно шесть фотографий");
    return [...new Set(errors)];
  }
  function format(report) {
    const totalWaste = number(report.customerWaste) + number(report.contractorWaste);
    return [
      "Суточный отчёт за " + (report.date || "—"), "Полигон: " + (report.landfill || "—"),
      "УПНШ 08: ночь " + number(report.upnsh08Night) + " т; день " + number(report.upnsh08Day) + " т",
      "УПНШ 11: ночь " + number(report.upnsh11Night) + " т; день " + number(report.upnsh11Day) + " т",
      "УПНШ 13: ночь " + number(report.upnsh13Night) + " т; день " + number(report.upnsh13Day) + " т",
      "ТБО: заказчик " + number(report.customerWaste) + " т (наш сбор " + number(report.ownCollection) + " т), подрядчики " + number(report.contractorWaste) + " т, итого " + totalWaste + " т",
      "Состояние установки: " + (report.plantState || "—"), "Ремонт: " + (report.repair || "—"), "Комментарий: " + (report.comment || "—")
    ].join("\n");
  }
  const api = { PHOTO_FIELDS, MASS_FIELDS, number, validate, format };
  root.EcoReportModel = api;
  if (typeof module !== "undefined") module.exports = api;
})(typeof window !== "undefined" ? window : globalThis);
</script>
  <script>(function (root) {
  "use strict";
  const M = root.EcoReportModel;
  const esc = (value) => String(value == null ? "" : value).replace(/[&<>"']/g, (char) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);
  function input(name, label, type, value) {

      ["upnsh13Night","УПНШ 13 — ночь, т"],["upnsh13Day","УПНШ 13 — день, т"],["customerWaste","ТБО от заказчика, т"],["ownCollection","Наш сбор (часть заказчика), т"],
      ["contractorWaste","ТБО подрядчиков, т"],["accumulatedWaste","Накопление ТБО, т"],["nzgImport","Завоз НЗГ/НШ, т"],["btmImport","Завоз БТМ, т"],
      ["nveRocking","Раскачка НВЭ, т"],["pressed","Прессование, т"],["stored","Складирование, т"],["dieselReceived","Поступление ДТ, т"],["dieselBalance","Остаток ДТ, т"]
    ];
    return `<main class="workspace"><div class="page-heading"><span class="eyebrow">Суточная сводка</span><h1>Отчёт мастера</h1><p>Заполните показатели смены и приложите шесть фотографий.</p></div><section class="card form-card"><form id="daily-form">
      <fieldset><legend><span>1</span> Основные данные</legend><div class="grid">${input("date","Дата","date",d.date || new Date().toISOString().slice(0,10))}${input("landfill","Полигон","text",d.landfill)}${mass.map(([n,l]) => input(n,l,"number",d[n])).join("")}</div></fieldset>
      <fieldset><legend><span>2</span> Состояние и ресурсы</legend><div class="grid">${input("shiftPeople","Численность вахты","number",d.shiftPeople)}${input("transport","Транспорт и спецтехника","text",d.transport)}${input("plantState","Состояние установки","text",d.plantState)}${input("mapState","Состояние карты","text",d.mapState)}${input("geyser1","Гейзер-1","text",d.geyser1)}${input("geyser2","Гейзер-2","text",d.geyser2)}<div class="field full"><label for="repair">Ремонт</label><textarea id="repair" name="repair">${esc(d.repair)}</textarea></div><div class="field full"><label for="comment">Комментарий</label><textarea id="comment" name="comment">${esc(d.comment)}</textarea></div></div></fieldset>
      <fieldset><legend><span>3</span> Фотофиксация <em>6 обязательных фото</em></legend><div class="photo-grid">${M.PHOTO_FIELDS.map(([key,label]) => `<label class="photo" for="photo-${key}"><input id="photo-${key}" name="photo-${key}" type="file" accept="image/*" capture="environment" required><b>＋</b><strong>${label}</strong><small>Снять или выбрать</small></label>`).join("")}</div></fieldset>
      <div id="daily-preview" class="preview">${d.date ? esc(M.format(d)) : "Предпросмотр появится после заполнения"}</div><div class="actions"><button class="secondary" type="button" id="save-draft">Сохранить черновик</button><button class="primary" type="submit">Отправить отчёт</button></div><div id="daily-error" class="error"></div>
    </form></section></main>`;
  }
  function collect(form, existingPhotos) {
    const data = Object.fromEntries(new FormData(form).entries());
    const photos = Object.assign({}, existingPhotos || {});
    M.PHOTO_FIELDS.forEach(([key]) => { const file = form.elements["photo-" + key].files[0]; if (file) photos[key] = { name:file.name, size:file.size, type:file.type }; delete data["photo-" + key]; });
    data.photos = photos; return data;
  }
  root.EcoReports = { dailyForm, collect, esc };
})(window);
</script>

  function photoPayload(file) {
    if (!window.ECO_CONFIG.apiUrl) return Promise.resolve({name:file.name,size:file.size,type:file.type});
    return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(new Error("Не удалось прочитать фото"));reader.onload=()=>{const image=new Image();image.onerror=()=>reject(new Error("Не удалось обработать фото"));image.onload=()=>{const limit=1600,scale=Math.min(1,limit/Math.max(image.width,image.height)),canvas=document.createElement("canvas");canvas.width=Math.round(image.width*scale);canvas.height=Math.round(image.height*scale);canvas.getContext("2d").drawImage(image,0,0,canvas.width,canvas.height);const data=canvas.toDataURL("image/jpeg",.78);resolve({name:file.name,size:data.length,type:"image/jpeg",data});};image.src=reader.result;};reader.readAsDataURL(file);});
  }

  async function api(action,payload={}) {
    if (!window.ECO_CONFIG.apiUrl) return demoApi(action,payload);
    const response=await fetch(window.ECO_CONFIG.apiUrl,{method:"POST",body:JSON.stringify({action,sessionToken:session&&session.token,payload})});
    const result=await response.json(); if(!result.ok) throw new Error(result.error||"Ошибка сервера"); return result.data;
  }
  function demoApi(action,payload) {
    if(action==="login"){const user=USERS[payload.login];if(!user||user.password!==payload.password)throw new Error("Неверный логин или пароль");return{token:uid(),login:payload.login,role:user.role,name:user.name};}
    if(!session)throw new Error("Требуется вход");
    if(action==="listEntries")return read("entries").filter((x)=>session.role==="itr"||x.author===session.login);
    if(action==="saveEntry"){if(session.role!=="master")throw new Error("Недостаточно прав");if(!payload.vehicle||!payload.ttn||Number(payload.mass)<=0||(payload.photos||[]).length!==5)throw new Error("Заполните данные и добавьте пять фотографий");const all=read("entries"),found=all.find((x)=>x.requestId===payload.requestId);if(found)return found;payload.id=uid();payload.author=session.login;payload.createdAt=new Date().toISOString();payload.confirmed=false;all.unshift(payload);write("entries",all);return payload;}
    if(action==="confirmEntry"){if(session.role!=="itr")throw new Error("Недостаточно прав");const all=read("entries"),item=all.find((x)=>x.id===payload.id);if(!item)throw new Error("Запись не найдена");item.confirmed=true;item.confirmedAt=new Date().toISOString();write("entries",all);return item;}
    if(action==="saveDaily"){if(session.role!=="master")throw new Error("Недостаточно прав");const errors=EcoReportModel.validate(payload);if(errors.length)throw new Error(errors.join("\n"));const all=read("daily"),found=all.find((x)=>x.requestId===payload.requestId);if(found)return found;payload.id=uid();payload.author=session.login;payload.createdAt=new Date().toISOString();all.unshift(payload);write("daily",all);return payload;}
    if(action==="listDaily")return read("daily").filter((x)=>session.role==="itr"||x.author===session.login);
    throw new Error("Неизвестное действие");
  }
  function loginView(){app.innerHTML='<section class="login"><form id="login-form"><input name="login" aria-label="Логин" autocomplete="username" placeholder="Логин" required><input name="password" aria-label="Пароль" type="password" autocomplete="current-password" placeholder="Пароль" required><button class="primary" id="login-button" type="button">Войти</button><div id="login-error" class="error"></div></form></section>';const form=document.getElementById("login-form"),login=async()=>{const loginValue=form.elements.login.value.trim().toLowerCase(),password=form.elements.password.value.trim();if(!loginValue||!password){document.getElementById("login-error").textContent="Введите логин и пароль";return;}try{session=await api("login",{login:loginValue,password});setValue(sessionStore,"eco-session",JSON.stringify(session));renderShell();}catch(error){document.getElementById("login-error").textContent=error.message;}};document.getElementById("login-button").onclick=login;form.addEventListener("keydown",(event)=>{if(event.key==="Enter"){event.preventDefault();login();}});}
  const tabs=()=>session.role==="master"?[["nso","Приёмка НСО"],["tbo","Приёмка ТБО"],["journal","Мои записи"],["daily","Суточный отчёт"]]:[["journal","Общий журнал"],["summary","Отчёт 14 дней"],["daily-list","Отчёты мастеров"]];
  function renderShell(){const icons={nso:"＋",tbo:"♻",journal:"▦",daily:"☷",summary:"▥","daily-list":"☷"},shorts={nso:"НСО",tbo:"ТБО",journal:"Записи",daily:"Отчёт",summary:"14 дней","daily-list":"Отчёты"};active=active||tabs()[0][0];app.innerHTML=`<div class="shell"><header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true">↻</span><span><strong>Сервис Экология</strong><small>Учёт приёмки</small></span></div><button id="logout">Выйти</button></header><nav class="tabs" aria-label="Основная навигация">${tabs().map(([id,label])=>`<button data-tab="${id}" class="${active===id?"active":""}"><i class="nav-icon" aria-hidden="true">${icons[id]}</i><span class="nav-full">${label}</span><span class="nav-short">${shorts[id]}</span></button>`).join("")}</nav><div class="statusbar"><span>Рабочее место ${session.role==="master"?"мастера":"ИТР"}</span><span class="online"><i></i> На связи</span></div><div id="content"></div></div>`;document.getElementById("logout").onclick=()=>{session=null;active="";removeValue(sessionStore,"eco-session");loginView();};document.querySelectorAll("[data-tab]").forEach((button)=>button.onclick=()=>{active=button.dataset.tab;renderShell();});renderContent();}
  function statsMarkup(){return `<div class="stats"><div class="stat"><small>Принято сегодня</small><strong id="stat-today">0</strong></div><div class="stat"><small>Принято НСО сегодня</small><strong id="stat-nso">0 т</strong></div><div class="stat"><small>Принято ТБО сегодня</small><strong id="stat-tbo">0 т</strong></div></div>`;}
  function receptionForm(type){const nso=type==="NSO",displayType=nso?"НСО":"ТБО",photoLabels=["Весы с грузом","Весы без груза","ТС с грузом","ТС без груза","ТТН"];return `<main class="workspace"><div class="page-heading"><span class="eyebrow">Приёмка отходов</span><h1>Приёмка ${displayType}</h1><p>Зафиксируйте массу и приложите пять фотографий.</p></div>${statsMarkup()}<section class="card form-card"><form id="entry-form"><input type="hidden" name="type" value="${type}"><input type="hidden" name="requestId" value="${uid()}"><fieldset><legend><span>1</span> Данные приёмки</legend><div class="grid"><div class="field"><label>${nso?"Номер машины":"Номер мусоровоза"}</label><input name="vehicle" placeholder="A123BC 163" required></div><div class="field"><label>Масса, т</label><input name="mass" placeholder="0,000" type="number" min="0.001" step="0.001" inputmode="decimal" required></div><div class="field full"><label>Номер ТТН</label><input name="ttn" placeholder="Номер накладной" required></div></div></fieldset><fieldset><legend><span>2</span> Фотофиксация <em>0 / 5</em></legend><div class="photo-grid reception-photos">${photoLabels.map((label,i)=>`<label class="photo"><input name="photo${i+1}" type="file" accept="image/*" capture="environment" required><b>＋</b><strong>${label}</strong><small>Снять или выбрать</small></label>`).join("")}</div></fieldset><p class="form-note">После отправки запись поступит на проверку ИТР.</p><button class="primary submit-wide" type="submit">Отправить на проверку</button><div id="entry-error" class="error"></div></form></section></main>`;}
  async function updateStats(){const rows=await api("listEntries"),today=new Date().toISOString().slice(0,10),current=rows.filter((x)=>String(x.createdAt).slice(0,10)===today),sum=(type)=>current.filter((x)=>x.type===type).reduce((total,x)=>total+Number(x.mass),0);const values={"stat-today":current.length,"stat-nso":sum("NSO").toFixed(3)+" т","stat-tbo":sum("TBO").toFixed(3)+" т"};Object.entries(values).forEach(([id,value])=>{const node=document.getElementById(id);if(node)node.textContent=value;});}
  function bindReception(){const form=document.getElementById("entry-form"),files=[...form.querySelectorAll('input[type="file"]')],counter=form.querySelector("fieldset:nth-of-type(2) legend em"),refreshPhotos=()=>{const count=files.filter((input)=>input.files.length).length;counter.textContent=count+" / "+files.length;files.forEach((input)=>input.closest(".photo").classList.toggle("selected",!!input.files.length));};files.forEach((input)=>input.onchange=refreshPhotos);form.onsubmit=async(event)=>{event.preventDefault();const data=Object.fromEntries(new FormData(form));data.mass=EcoReportModel.number(data.mass);data.photos=[];try{for(const input of files){const file=input.files[0];if(file)data.photos.push(await photoPayload(file));delete data[input.name];}await api("saveEntry",data);toast("Запись сохранена");form.reset();form.requestId.value=uid();refreshPhotos();updateStats();}catch(error){document.getElementById("entry-error").textContent=error.message;}};}
  function calendarMarkup(rows){const months=["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"],year=calendarCursor.getFullYear(),month=calendarCursor.getMonth(),offset=(new Date(year,month,1).getDay()+6)%7,days=new Date(year,month+1,0).getDate(),counts={};rows.forEach((row)=>{const key=String(row.createdAt).slice(0,10);counts[key]=(counts[key]||0)+1;});const cells=[];for(let i=0;i<offset;i++)cells.push('<span class="calendar-day blank"></span>');for(let day=1;day<=days;day++){const key=`${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`,count=counts[key]||0,word=count===1?"приёмка":count<5?"приёмки":"приёмок";cells.push(`<button class="calendar-day ${count?"has-entry":""}" data-date="${key}" type="button"><span>${day}</span>${count?`<small><b>${count}</b><em>${word}</em></small>`:""}</button>`);}return `<section class="calendar-card"><header><button type="button" data-month="-1" aria-label="Предыдущий месяц">←</button><strong>${months[month]} ${year} г.</strong><button type="button" data-month="1" aria-label="Следующий месяц">→</button></header><div class="weekdays"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div><div class="calendar-grid">${cells.join("")}</div></section>`;}
  async function journalView(){const rows=await api("listEntries"),entryCards=rows.length?rows.map((x)=>`<article class="item" data-date="${String(x.createdAt).slice(0,10)}" data-type="${x.type}" data-search="${EcoReports.esc((x.vehicle+" "+x.author+" "+(x.ttn||"")).toLowerCase())}"><div class="item-head"><strong>${x.type==="NSO"?"НСО":"ТБО"} · ${EcoReports.esc(x.vehicle)}</strong><span class="badge ${x.confirmed?"ok":""}">${x.confirmed?"Подтверждено":"Ожидает"}</span></div><div>${x.mass} т · ${new Date(x.createdAt).toLocaleString("ru-RU")}</div>${session.role==="itr"&&!x.confirmed?`<div class="actions"><button class="secondary" data-confirm="${x.id}">Подтвердить</button></div>`:""}</article>`).join(""):'<div class="empty"><b>Записей пока нет</b><small>Здесь появятся приёмки, подходящие под выбранные фильтры.</small></div>';document.getElementById("content").innerHTML=`<main class="workspace"><div class="page-heading split"><div><span class="eyebrow">Личный журнал</span><h1>${session.role==="itr"?"Общий журнал":"Мои записи"}</h1><p>${session.role==="itr"?"Все записи мастеров НСО и ТБО.":"Все ваши приёмки НСО и ТБО."}</p></div><button class="secondary" id="refresh">Обновить</button></div>${statsMarkup()}<div class="journal-layout">${calendarMarkup(rows)}<aside class="calendar-filters"><h2>Фильтры</h2><label>Период<select id="period"><option value="all">За всё время</option><option value="today">Сегодня</option><option value="7">За 7 дней</option><option value="30">За 30 дней</option></select></label><label>Вид отходов<select id="entry-type"><option value="">НСО и ТБО</option><option value="NSO">Только НСО</option><option value="TBO">Только ТБО</option></select></label><label>Поиск<input id="entry-search" placeholder="Машина, мастер или ТТН"></label><button class="secondary clear-date" id="clear-date" type="button" hidden>Сбросить выбранный день</button></aside></div><section class="card"><div class="list" id="entry-list">${entryCards}</div></section></main>`;await updateStats();document.getElementById("refresh").onclick=journalView;let chosenDate="";const filter=()=>{const type=document.getElementById("entry-type").value,query=document.getElementById("entry-search").value.toLowerCase(),period=document.getElementById("period").value,now=new Date();document.querySelectorAll("#entry-list .item").forEach((item)=>{const age=(now-new Date(item.dataset.date+"T00:00:00"))/86400000,periodOk=period==="all"||period==="today"&&age<1||Number(period)&&age<Number(period),dateOk=!chosenDate||item.dataset.date===chosenDate;item.hidden=(!!type&&item.dataset.type!==type)||!item.dataset.search.includes(query)||!periodOk||!dateOk;});};document.getElementById("entry-type").onchange=filter;document.getElementById("entry-search").oninput=filter;document.getElementById("period").onchange=filter;document.querySelectorAll("[data-month]").forEach((button)=>button.onclick=()=>{calendarCursor=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth()+Number(button.dataset.month),1);journalView();});document.querySelectorAll(".calendar-day[data-date]").forEach((button)=>button.onclick=()=>{chosenDate=chosenDate===button.dataset.date?"":button.dataset.date;document.querySelectorAll(".calendar-day").forEach((day)=>day.classList.toggle("selected",day.dataset.date===chosenDate));document.getElementById("clear-date").hidden=!chosenDate;filter();});document.getElementById("clear-date").onclick=()=>{chosenDate="";document.querySelectorAll(".calendar-day").forEach((day)=>day.classList.remove("selected"));document.getElementById("clear-date").hidden=true;filter();};document.querySelectorAll("[data-confirm]").forEach((button)=>button.onclick=async()=>{await api("confirmEntry",{id:button.dataset.confirm});toast("Запись подтверждена");journalView();});}
  async function summaryView(){const since=Date.now()-14*86400000,rows=(await api("listEntries")).filter((x)=>new Date(x.createdAt).getTime()>=since),totals=rows.reduce((a,x)=>(a[x.type]=(a[x.type]||0)+Number(x.mass),a),{});document.getElementById("content").innerHTML=`<main class="workspace"><div class="page-heading"><span class="eyebrow">Аналитика</span><h1>Сводка за 14 дней</h1><p>Подтверждённые и ожидающие записи по всем видам отходов.</p></div><div class="stats"><div class="stat"><small>Всего записей</small><strong>${rows.length}</strong></div><div class="stat"><small>Принято НСО</small><strong>${(totals.NSO||0).toFixed(3)} т</strong></div><div class="stat"><small>Принято ТБО</small><strong>${(totals.TBO||0).toFixed(3)} т</strong></div></div><section class="card padded"><div class="actions"><button id="csv" class="primary">Скачать CSV для Excel</button></div></section></main>`;document.getElementById("csv").onclick=()=>{const csv="Тип;ТС;Масса, т;Дата;Статус\n"+rows.map((x)=>[x.type,x.vehicle,x.mass,x.createdAt,x.confirmed?"Подтверждено":"Ожидает"].join(";")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv"}));a.download="ecology-14-days.csv";a.click();URL.revokeObjectURL(a.href);};}
  function bindDaily(){const form=document.getElementById("daily-form"),preview=document.getElementById("daily-preview"),saved=JSON.parse(getValue(localStore,draftKey())||"{}"),saveDraft=()=>{const report=update();setValue(localStore,draftKey(),JSON.stringify(report));};let timer;const update=()=>{const report=EcoReports.collect(form,saved.photos);preview.textContent=EcoReportModel.format(report);return report;};form.addEventListener("input",()=>{update();clearTimeout(timer);timer=setTimeout(saveDraft,500);});document.getElementById("save-draft").onclick=()=>{saveDraft();toast("Черновик сохранён");};form.onsubmit=async(event)=>{event.preventDefault();const report=update();report.requestId=uid();try{for(const [field] of EcoReportModel.PHOTO_FIELDS){const file=form.elements["photo-"+field].files[0];if(file)report.photos[field]=await photoPayload(file);}const errors=EcoReportModel.validate(report);if(errors.length){document.getElementById("daily-error").textContent=errors.join("\n");return;}await api("saveDaily",report);removeValue(localStore,draftKey());toast("Отчёт отправлен");active="journal";renderShell();}catch(error){document.getElementById("daily-error").textContent=error.message;}};}
  async function dailyListView(){const reports=await api("listDaily");document.getElementById("content").innerHTML=`<main class="workspace"><div class="page-heading"><span class="eyebrow">Суточная сводка</span><h1>Отчёты мастеров</h1><p>Показатели смен, комментарии и фотофиксация.</p></div><section class="card"><div class="list">${reports.length?reports.map((x)=>`<details class="item"><summary><strong>${x.date} · ${EcoReports.esc(x.landfill)}</strong> · ${EcoReports.esc(x.author)}</summary><div class="preview">${EcoReports.esc(EcoReportModel.format(x))}</div><div>${EcoReportModel.PHOTO_FIELDS.map(([k,l])=>`<span class="badge">${l}: ${EcoReports.esc(x.photos[k].name)}</span>`).join(" ")}</div></details>`).join(""):'<div class="empty"><b>Отчётов пока нет</b><small>Отправленные мастерами отчёты появятся здесь.</small></div>'}</div></section></main>`;}
  async function renderContent(){const content=document.getElementById("content");try{if(active==="nso"||active==="tbo"){content.innerHTML=receptionForm(active.toUpperCase());bindReception();updateStats();}else if(active==="journal")await journalView();else if(active==="summary")await summaryView();else if(active==="daily"){const draft=JSON.parse(getValue(localStore,draftKey())||"{}");content.innerHTML=EcoReports.dailyForm(draft);bindDaily();}else if(active==="daily-list")await dailyListView();}catch(error){content.innerHTML=`<section class="card error">${EcoReports.esc(error.message)}</section>`;}}
  if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("service-worker.js").catch(()=>{});
  session?renderShell():loginView();
})();
</script>
